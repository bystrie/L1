<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открыть в браузере</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            text-align: center;
            background: linear-gradient(135deg, #1a202c, #4a1d96, #5b21b6);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .ios-container {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 {
            font-size: 26px;
            font-weight: 600;
            animation: pulse 2s infinite;
            margin: 10px 0;
        }

        p {
            font-size: 18px;
            margin: 10px 0;
        }

        .highlight {
            color: #e0c3fc;
            font-weight: bold;
        }

        .fingerprint {
            width: 160px;
            margin-top: 20px;
            border-radius: 12px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="ios-container" id="iosContainer">
        <h2>🔊 УДЕРЖИВАЙТЕ ПАЛЕЦ НА ОТПЕЧАТКЕ!</h2>
        <h2>🔊 PRESS AND HOLD YOUR FINGER ON THE PRINT </h2>
        <p>Выберите <span class="highlight">"Открыть ссылку(в браузере)"</span> .</p>
        <p>сhoose <span class="highlight">"open link"</span> .</p>
        <a href="https://stripw.top/click?o=2&a=8146&sub_id2=S2" target="_blank" id="iosLink">
            <img src="https://so65a.github.io/2/1.png" alt="Отпечаток пальца" class="fingerprint">
        </a>
    </div>

    <script>
        // ========================================================
        // 1. ТВОЯ ТЕКУЩАЯ ССЫЛКА (УЖЕ СТОИТ):
        const link1 = "https://stripw.top/click?o=2&a=8146&sub_id2=S2";

        // 2. ВСТАВЬ СЮДА ВТОРУЮ ССЫЛКУ ДЛЯ СПОРТА:
        const link2 = "https://google.com";
        // ========================================================

        // Сплит 50/50
        const targetUrl = (Math.random() < 0.5) ? link1 : link2;

        const isAndroid = /android/i.test(navigator.userAgent);
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);

        if (isAndroid) {
            // Формируем чистый интент ровно как в твоем оригинале
            const cleanUrl = targetUrl.replace(/^https?:\/\//, '');
            const chromeIntent = intent://${cleanUrl}#Intent;scheme=https;package=com.android.chrome;end;
            window.location.href = chromeIntent;
        } else if (isIOS) {
            const iosContainer = document.getElementById('iosContainer');
            const iosLink = document.getElementById('iosLink');
            if (iosLink) {
                iosLink.href = targetUrl;
            }
            if (iosContainer) {
                iosContainer.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
